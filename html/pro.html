<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3"></script>
    <!-- import CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">


    <link rel="stylesheet" href="https://cdn.staticfile.net/font-awesome/4.7.0/css/font-awesome.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


    <!-- import JavaScript -->
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <style>


    .elinput1 .el-input__wrapper {
        background-color: #2c2c2c;
        box-shadow:0 0 0 0px
    }

    /* 自定义滚动条区域 */
    .scroll-container {
      max-height: 700px; /* 设置最大高度 */
      overflow: auto;
    }
    .select .el-select__wrapper{
        background-color: #2c2c2c;
         box-shadow:0 0 0 0px
    }
    .select .el-select__placeholder{
        color: white;
    }
    #copy-btn {
        background-color: #2c2c2c;
        width: 5%;
        border: none;
        border-radius: 10px;
        padding: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
        position: absolute;
        bottom: 0;
        height: 96%;
        right: 10%;

        z-index: 100;
    }

    #copy-btn.disabled {
        pointer-events: none;
        /* 禁止按钮点击事件 */
        opacity: 0.3;
        /* 按钮变成半透明显示，表示禁用状态 */
    }
    #copy-btn1 {
        background-color: #2c2c2c;
        width: 5%;
        border: none;
        border-radius: 10px;
        padding: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
        position: absolute;
        bottom: 0;
        height: 96%;
        right: 10%;

        z-index: 100;
    }

    #copy-btn1.disabled {
        pointer-events: none;
        /* 禁止按钮点击事件 */
        opacity: 0.3;
        /* 按钮变成半透明显示，表示禁用状态 */
    }
    /* Textarea styles */
    #t4 {
        bottom: 0;
        white-space: pre-wrap;
        background-color: #2c2c2c;
        height: 100%;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 14px;
        left: 3%;
        resize: none;
        overflow-y: scroll;
        /* 允许垂直滚动 */
        overflow-x: hidden;


        /* 设置滚动条宽度为1px */
        scrollbar-color: #2c2c2c transparent;
        /* 设置滑块颜色和轨道透明 */
        padding-right: 10%;

        width: 95%;
        position: absolute;

    }
    #de4 {
        position: absolute;
        bottom: 0;
        height: 15%;

    }
    .custom-tree-node {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      padding-right: 8px;
    }
    .el-button.is-text {
        background-color: transparent;
        border: 0 solid transparent;
        color: #4b85dd;
    }
    .el-button, .el-button.is-round {
        padding: 0px 15px;
    }
  </style>
</head>
<body style="background-color: black">

<div id="app" style="height:950px" >
    <div class="tree-container" style="position: relative;height: 100%" >
        <el-row >
        <el-input
            v-model="filterText"
            placeholder="Type"
            clearable
            :prefix-icon="Searchic"
            style="background-color: black"
            class="elinput1"
        >

        </el-input>
        </el-row>
        <el-row class="row">
            <el-scrollbar class="scroll-container">
                <el-tree
                    :data="fileTreeData"
                    :props="treeProps"
                    ref="tree"
                    show-checkbox
                    @node-contextmenu="handleEvents"
                    accordion
                    :filter-node-method="filterNode"
                    draggable
                    style="background-color: #2c2c2c;  color: white; --el-tree-node-hover-bg-color: #4b85dd;"
                    node-key="id"
                    @check-change="handleCheckChange"
                    check-strictly
                    :expand-on-click-node = "false"
                >
                    <div #default="{ node, data }">
                        <span class="custom-tree-node">
                          <span>{{ node.label }}</span>
                          <span>
                            <a @click="open(data)"> open </a>
                          </span>
                        </span>
                      </div>
                </el-tree>
            </el-scrollbar>
        </el-row>

         <div id="de4" style="left: 0; width: 100%;">

                <el-text style="
                color: white;
                padding-top: 2.5%;
                height: 30%;
                width: 70%;
                top: 0;
                position: absolute;
                font-size: 14px;
                left: 3%;"
                >  对 {{ textValue }}进行</el-text>

                <el-select class="select" v-model="value" placeholder="Select" style="
                background-color: black;
                height: 30%;
                width: 20%;
                top: 0;
                left: 70%;
                padding-top: 1%;
                position: absolute;"
                >
                    <el-option
                      v-for="item in options"
                      :key="item.value"
                      :label="item.label"
                      :value="item.value"
                    ></el-option>
                </el-select>
                <el-button  style="
                background-color: black;
                height: 30%;
                width: 7%;
                top: 0;
                left: 93%;
                position: absolute;"
                text
                @click="newPro">NewPro</el-button>
                <div style="
                height: 60%;
                width: 100%;
                bottom: 0;
                position: absolute;">
                    <textarea rows="40" cols="50" placeholder="Please enter your code requirements here." id="t4" v-model="chinese"></textarea>
                    <button v-if="!isDisabled" :disabled="isDisabled" id="copy-btn1"
                        style="font-size:24px;color:rgb(0, 153, 255)" @click="rawchinese"
                         title="Please use caution when refactoring all modules of the current project."><i
                            class="fa fa-paper-plane"></i></button>
                    <button v-if="isDisabled" :disabled="!isDisabled" id="copy-btn"
                        style="font-size:24px;color:rgb(0, 153, 255)" @click="rawchinese"
                         title="Please use caution when refactoring all modules of the current project."><i
                            class="fas fa-spinner fa-spin"></i></button>
                </div>
         </div>
        <el-dialog title="New Node" v-model="newFolderDialogVisible">
            <el-input v-model="newFolderName" placeholder="Enter folder name"></el-input>
            <span slot="footer" class="dialog-footer">
                <el-button @click="newFolderDialogVisible = false">Cancel</el-button>
                <el-button type="primary" @click="addNode()">Create</el-button>
            </span>
        </el-dialog>
        <el-dialog title="Are you sure you want to delete this node?" v-model="deleteFolderDialogVisible">
            <span slot="footer" class="dialog-footer">
                <el-button @click="deleteFolderDialogVisible = false">Cancel</el-button>
                <el-button type="primary" @click="deleteNode()">Delete</el-button>
            </span>
        </el-dialog>
        <el-dialog title="Rename Folder" v-model="renameFolderDialogVisible">
            <el-input v-model="renameFolderName" placeholder="Enter folder name"></el-input>
            <span slot="footer" class="dialog-footer">
                <el-button @click="renameFolderDialogVisible = false">Cancel</el-button>
                <el-button type="primary" @click="renameNode()">Rename</el-button>
            </span>
        </el-dialog>
    </div>
</div>

<script>
    const { createApp, ref,watch ,onMounted} = Vue;
    const { ElTree, ElDialog, ElButton, ElInput,ElScrollbar , ElSelect, ElOption} = ElementPlus;
    const { Calendar, Search ,Plus} = ElementPlusIconsVue; // 从全局对象获取图标
    const vscode = acquireVsCodeApi();
    const app = createApp({
        components: {
            ElScrollbar,
            ElTree,
            ElDialog,
            ElButton,
            ElInput,
            Calendar,
            Search,
            ElSelect,
            ElOption,
            Plus
        },
        setup() {
            const newPro = () =>{

                handleNodeClick(tree.value)
                console.log("123")
                newFolderDialogVisible.value = true;
            }
            const textValue = ref('选中文件：#')  // 定义一个响应式变量
            const options = [
              {
                value: 'Option1',
                label: '细化',
              },
              {
                value: 'Option2',
                label: '重构',
              }
            ]
            const open = (data) => {
                console.log(data.id)
                //todo  连接后端打开content.pseudo
                vscode.postMessage({

              })
            }
            const isDisabled = ref(false)
            const chinese = ref('')
            const value = ref(options[0].value)
            const textarea1 = ref('')
            const Searchic = Search;
            const pluss = Plus;
            const filterText = ref('')
            const tree = ref(null);
            const filterNodeMethod = (node, query) => {
              return node.label.toLowerCase().includes(query.toLowerCase());
            };
            const handleCheckChange = (
              data, checked, indeterminate
            ) => {
              if (checked) {
                // 如果选中当前节点，则取消其他节点的选中状态
                tree.value.setCheckedKeys([data.id], false)
                textValue.value = data.id
              }
            }
            const rawchinese = () => {
                //todo  
              if(value.value === 'Option1'){//细化
                  const con = chinese.value//用户输入框内容
                  const id = textValue.value//当前选中树节点的id
                  console.log(con + "!"+ id)
                  //细化传参为 con 和 id
                  vscode.postMessage({

                  })
              }else if(value.value === 'Option2'){//重构
                  const con = chinese.value//用户输入框内容
                  const id = textValue.value//当前选中树节点的id
                  //重构传参为 con 和 id
                  vscode.postMessage({

                  })
              }
            }
            watch(filterText, (val) => {
              if (tree.value) {
                tree.value.filter(val,filterNodeMethod); // 调用树组件中的 filter 方法
              }
            });
            const filterNode = (value, data) => {
              if (!value) return true
              return data.label.includes(value)
            }
            const currentNode = ref(null);
            // 处理节点点击事件
            function handleNodeClick(data){
              currentNode.value = data;
            }
            const deleteNode = () =>{
                vscode.postMessage({
                     command: 'deletenode',
                     fatherid: currentNode.value.data.id,

                })
                tree.value.remove(currentNode.value.data.id)
                deleteFolderDialogVisible.value = false
            }
            const renameNode = () =>{
              currentNode.value.data.label = renameFolderName.value
              renameFolderDialogVisible.value = false
            }
            // 动态添加节点
            const addNode = () => {
                let newNode;//新建根节点还是新建叶子节点
              if (currentNode.value.data.id) {
                  newNode = {
                      id: currentNode.value.data.id + "/" + newFolderName.value,
                      label: newFolderName.value,
                      children: [] // 默认新节点没有子节点
                  };
                  vscode.postMessage({
                     command: 'addnode',
                     fatherid: currentNode.value.data.id,
                     childlabel: newFolderName.value
                  })
              }else{
                  newNode = {
                      id:  newFolderName.value,
                      label: newFolderName.value,
                      children: [] // 默认新节点没有子节点
                  };
                  vscode.postMessage({
                     command: 'addpro',
                     childlabel: newFolderName.value
                  })
              }

              tree.value.append(newNode,currentNode.value.data.id)
              newFolderDialogVisible.value = false


            };
            const fileTreeData = ref([
              {
                label: "节点1",
                id:"节点1",
                children: [
                  {
                    label: "子节点1-1",
                    id:"节点1\\子节点1-1",
                    children: [
                      {
                        label: "子节点1-1-1",
                        id:"节点1\\子节点1-1\\子节点1-1-1",
                        children: []
                      }
                    ]
                  }
                ]
              },
              {
                label: "节点2",
                id:"节点2",
                children: [
                  {
                    label: "子节点2-1",
                    id:"节点2\\子节点2-1",
                    children: [
                      {
                        label: "子节点2-1-1",
                        id:"节点2\\子节点2-1\\子节点2-1-1",
                        children: []
                      }
                    ]
                  }
                ]
              },
            ]);

            const treeProps = {
                children: 'children',
                label: 'label',
            };

            const newFolderDialogVisible = ref(false);
            const deleteFolderDialogVisible = ref(false);
            const renameFolderDialogVisible = ref(false);
            const newFolderName = ref('');
            const renameFolderName = ref('');
            let isMenu = false;  // 标记方法是否正在执行
            onMounted(() => {
                 document.addEventListener('mousedown', handleMouseDown);
            });
            function handleMouseDown(event) {
              const div = document.querySelector('#menu'); // 目标 div
              if (div && !div.contains(event.target)) {
                // 鼠标按下不在 div 内的区域，执行的操作
                console.log('Mouse down happened outside the div');
                document.body.removeChild(div);
                isMenu = false
              }
            }
            const handleContextMenu = (event) => {

                if(isMenu){
                    return
                }
                isMenu = true
                event.preventDefault();

                const menu = document.createElement('div');
                menu.style.position = 'absolute';
                menu.style.top = `${event.clientY}px`;
                menu.style.left = `${event.clientX}px`;
                menu.style.backgroundColor = '#fff';
                menu.style.border = '1px solid #ddd';
                menu.style.padding = '5px';
                menu.style.zIndex = '1000';
                menu.id = 'menu';
                menu.addEventListener('mousedown',(event) => {

                });
                const createFolderOption = document.createElement('div');
                createFolderOption.textContent = 'New Node';
                createFolderOption.style.padding = '5px';
                createFolderOption.style.color =  "#4b85dd";
                createFolderOption.style.fontWeight = 'bold';
                createFolderOption.addEventListener('click', () => {
                    newFolderDialogVisible.value = true;
                    document.body.removeChild(menu);
                    isMenu = false
                });
                const deleteFolderOption = document.createElement('div');
                deleteFolderOption.textContent = 'Delete Node';
                deleteFolderOption.style.padding = '5px';
                deleteFolderOption.style.color =  "#4b85dd";
                deleteFolderOption.style.fontWeight = 'bold';
                deleteFolderOption.addEventListener('click', () => {
                    deleteFolderDialogVisible.value = true;
                    document.body.removeChild(menu);
                    isMenu = false
                });
                const renameFolderOption = document.createElement('div');
                renameFolderOption.textContent = 'Rename Node';
                renameFolderOption.style.padding = '5px';
                renameFolderOption.style.color =  "#4b85dd";
                renameFolderOption.style.fontWeight = 'bold';
                renameFolderOption.addEventListener('click', () => {
                    renameFolderDialogVisible.value = true;
                    document.body.removeChild(menu);
                    isMenu = false
                });
                const displayFolderOption = document.createElement('div');
                displayFolderOption.textContent = 'Display Node';
                displayFolderOption.style.padding = '5px';
                displayFolderOption.style.color =  "#4b85dd";
                displayFolderOption.style.fontWeight = 'bold';
                displayFolderOption.addEventListener('click', () => {
                    //todo  连接后端打开DISPLAY的逻辑
                    vscode.postMessage({

                    })
                    document.body.removeChild(menu);
                    isMenu = false
                });
                menu.appendChild(createFolderOption);
                menu.appendChild(deleteFolderOption);
                menu.appendChild(renameFolderOption);
                menu.appendChild(displayFolderOption);
                document.body.appendChild(menu);
            };
            function handleEvents(event,node,data) {
                handleContextMenu(event);
                handleNodeClick(data);
            }
            //向vscode发送命令模板
            //  rawchinese() {
            //     vscode.postMessage({
            //         command: 'updateproject',
            //         index: this.projects[this.currentProjectIndex].id,
            //         con: this.chinese,
            //     })
            //     this.chinese = "";
            // }
             //处理vscode传回的事件
             const handleMessage = (event)  =>{
                const message = event.data; // The JSON data our extension sent
                //listen
                switch (message.command) {
                    //todo 处理vscode传回的事件
                    default:
                        this.$set(this, "isDisabled", false)
                        return;
                }
            }
            return {
                tree,
                handleEvents,
                fileTreeData,
                treeProps,
                newFolderDialogVisible,
                newFolderName,
                renameFolderName,
                handleContextMenu,
                currentNode,
                handleNodeClick,
                addNode,
                filterText,
                filterNode,
                Searchic,
                textarea1,
                isMenu,
                handleCheckChange,
                options,
                value,
                textValue,
                open,
                pluss,
                newPro,
                deleteFolderDialogVisible,
                renameFolderDialogVisible,
                deleteNode,
                renameNode,
                rawchinese,
                isDisabled,
                chinese
            };
        }
    }).mount('#app');

</script>

</body>
</html>
